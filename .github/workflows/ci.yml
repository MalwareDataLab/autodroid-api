name: CI

on:
  push:
    branches:
      - main
      - qa

  pull_request:
    branches:
      - main
      - qa

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: yarn

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Lint and check types
        run: yarn lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: yarn

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Run build
        run: yarn build

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: yarn

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Install Playwright browser
        run: yarn workspace autodroid-api run playwright install --with-deps chromium

      - name: Write test environment file
        env:
          TEST_ENV: ${{ secrets.TEST_ENV }}
        run: |
          printf '%s\n' "$TEST_ENV" > packages/api/.env.test
          for entry in \
            APP_URL=http://localhost:3333 \
            FRONTEND_URL=https://localhost:3000 \
            SESSION_SECRET=test-session-secret \
            MCP_OAUTH_CLIENT_ID_SECRET=test-mcp-oauth-client-id-secret
          do
            grep -q "^${entry%%=*}=." packages/api/.env.test || printf '%s\n' "$entry" >> packages/api/.env.test
          done

      - name: Run tests
        run: yarn test --bail 1
