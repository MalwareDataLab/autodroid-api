# This workflow build and push a Docker image to Docker Hub.
#
# Required secrets:
# - DOCKERHUB_USERNAME: The username of Docker Hub
# - DOCKERHUB_TOKEN: The token of Docker Hub

name: Prepare, Build, Deploy and Release

on:
  push:
    branches:
      - "main"
      - "staging"
      - "qa"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      has_pr: ${{ steps.check-pr.outputs.has_pr }}
    steps:
      - name: Checkout to branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create Release PR
        id: prepare-release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: ${{ github.ref_name }}
          skip-github-release: true
          config-file: .github/config/release-please-config-${{ github.ref_name }}.json
          manifest-file: .github/config/release-please-manifest-${{ github.ref_name }}.json

      - name: Show release
        env:
          RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.prepare-release.outputs) }}
        run: printf '%s\n' "$RELEASE_PLEASE_OUTPUT" | jq

      # Considering "autorelease" as the label to trigger the deployment
      - name: Check open PRs for current branch to release
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          numbers=$(gh pr list --state open --base "$BASE_BRANCH" --json number,labels \
            --jq '[.[] | select(.labels[]?.name | test("autorelease")) | .number] | unique | join(" ")')

          if [ -z "$numbers" ]; then
            echo "There is no PR with a label containing 'autorelease' for the current branch."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Matching PR(s): $numbers"
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_numbers=$numbers" >> "$GITHUB_OUTPUT"
          fi

      - name: Request review from CODEOWNERS
        if: steps.check-pr.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ steps.check-pr.outputs.pr_numbers }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t owners < <(grep -o '@[[:alnum:]_-]\+' .github/CODEOWNERS | sed 's/@//' | sort -u)
          reviewers=()
          for owner in "${owners[@]}"; do
            reviewers+=(-f "reviewers[]=$owner")
          done
          for number in $PR_NUMBERS; do
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPOSITORY/pulls/$number/requested_reviewers" \
              "${reviewers[@]}"
          done

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.has_pr != 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout to branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get package information
        id: package-info
        run: |
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create image tag list
        id: tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PACKAGE_NAME: ${{ steps.package-info.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package-info.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          base="$DOCKERHUB_USERNAME/$PACKAGE_NAME"
          tags="$base:$PACKAGE_VERSION-$BRANCH"
          if [ "$BRANCH" = "main" ]; then
            tags="$tags,$base:latest,$base:$PACKAGE_VERSION"
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"

      - name: Show tag list
        env:
          TAGS: ${{ steps.tag.outputs.tag }}
        run: echo "$TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  sync-develop:
    name: Sync develop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare-release, deploy]
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.prepare-release.outputs.has_pr != 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout to branch
        uses: actions/checkout@v7

      - name: Push to develop branch
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop:develop || git checkout -b develop
          git checkout develop
          git pull origin develop
          git merge "$BRANCH" --no-ff -X theirs --no-edit
          git push origin develop

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: deploy
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true
          config-file: .github/config/release-please-config-${{ github.ref_name }}.json
          manifest-file: .github/config/release-please-manifest-${{ github.ref_name }}.json

      - name: Show release
        env:
          RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
        run: printf '%s\n' "$RELEASE_PLEASE_OUTPUT" | jq
